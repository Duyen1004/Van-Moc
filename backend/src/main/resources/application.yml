spring:
  application:
    name: van-moc
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/van_moc}
    username: ${SPRING_DATASOURCE_USERNAME:van_moc}
    password: ${SPRING_DATASOURCE_PASSWORD:van_moc}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:4000}

google:
  client-id: ${GOOGLE_CLIENT_ID:}
