services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: van_moc
      POSTGRES_USER: van_moc
      POSTGRES_PASSWORD: van_moc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U van_moc -d van_moc"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:webpack"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}

  backend:
    image: maven:3.9-eclipse-temurin-17
    profiles:
      - backend
    working_dir: /app
    command: sh -c "mvn spring-boot:run"
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/van_moc
      SPRING_DATASOURCE_USERNAME: van_moc
      SPRING_DATASOURCE_PASSWORD: van_moc
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  maven_cache:
